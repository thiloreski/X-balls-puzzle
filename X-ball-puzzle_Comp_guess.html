<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>I will find the wrong ball</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 550px; text-align: center; }
        .instruction-box { background: #eef2ff; padding: 18px; border-radius: 10px; margin-bottom: 20px; font-size: 0.95rem; color: #3730a3; line-height: 1.5; border: 1px solid #c7d2fe; text-align: left; }
        .scale-area { position: relative; height: 160px; margin: 2rem 0; }
        .beam { width: 100%; height: 8px; background: #475569; position: absolute; top: 50%; left: 0; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 4px; transform-origin: center; }
        .pan { width: 120px; min-height: 60px; border: 3px solid #475569; border-top: 0; position: absolute; top: 8px; border-radius: 0 0 55px 55px; background: rgba(0,0,0,0.03); display: flex; flex-wrap: wrap; justify-content: center; padding: 5px; }
        .left { left: 0; } .right { right: 0; }
        .ball { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; font-size: 11px; display: flex; align-items: center; justify-content: center; margin: 2px; font-weight: bold; }
        .btn { padding: 12px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; color: white; }
        .btn-blue { background: #2563eb; } .btn-gray { background: #64748b; } .btn-red { background: #e11d48; } .btn-green { background: #16a34a; width: 100%; font-size: 1.1rem; }
        .tilt-left { transform: rotate(-12deg); } .tilt-right { transform: rotate(12deg); }
        #game-area { display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-area">
        <h2 style="margin-top: 0;">I will find the wrong ball</h2>
        <div class="instruction-box">
            Enter the number of balls. Secretly choose one ball and decide if it is heavier or lighter. The AI will find it by asking for scale results.
        </div>
        <input type="number" id="ball_input" value="12" style="font-size: 1.5rem; width: 100px; text-align: center;"><br><br>
        <button id="start_trigger" class="btn btn-green">Start AI</button>
    </div>

    <div id="game-area">
        <div id="max_info" style="font-weight: bold; color: #ef4444; margin-bottom: 10px;"></div>
        <div class="scale-area">
            <div id="beam_element" class="beam">
                <div class="pan left" id="p_left"></div>
                <div class="pan right" id="p_right"></div>
            </div>
        </div>
        <h3 id="step_info" style="color: #2563eb;"></h3>
        <p id="instruction" style="font-weight: 500;"></p>
        <div id="action_btns">
            <button id="v_left" class="btn btn-blue">Left Heavier</button>
            <button id="v_equal" class="btn btn-gray">Equal</button>
            <button id="v_right" class="btn btn-red">Right Heavier</button>
        </div>
        <div id="result_display" class="hidden" style="margin: 20px 0; padding: 15px; background: #f0fdf4; border: 2px solid #22c55e; border-radius: 10px; color: #166534; font-weight: bold; font-size: 1.2rem;"></div>
        <button id="reload_btn" class="btn btn-gray hidden" onclick="location.reload()">Restart</button>
        <div id="storage" style="margin-top:20px; border-top: 1px solid #e2e8f0; padding-top:15px; display:flex; flex-wrap:wrap; justify-content:center;"></div>
    </div>
</div>

<script type="py">
from pyscript import document, window
from pyodide.ffi import create_proxy
import math

class AIController:
    def __init__(self, n):
        self.n = n
        self.possibilities = []
        for i in range(1, n + 1):
            self.possibilities.append((i, "lighter"))
            self.possibilities.append((i, "heavier"))
        self.step = 0
        self.max_w = math.ceil(math.log(2*n + 1, 3))
        document.getElementById("max_info").innerText = f"Target: Max {self.max_w} weighings"
        self.current_l = []
        self.current_r = []
        self.calculate_and_render()

    def get_result(self, ball, state, l_group, r_group):
        if ball in l_group: return "L" if state == "heavier" else "R"
        if ball in r_group: return "R" if state == "heavier" else "L"
        return "E"

    def calculate_and_render(self):
        if len(self.possibilities) <= 1:
            self.show_solution()
            return

        self.step += 1
        document.getElementById("step_info").innerText = f"Weighing {self.step}"
        
        candidates = list(set([p[0] for p in self.possibilities]))
        best_l, best_r = [], []
        min_worst_case = 999
        
        # Optimize split
        for m in range(1, (self.n // 2) + 1):
            l, r = candidates[:m], candidates[m:2*m]
            if not r or len(l) != len(r): continue
            
            counts = {"L": 0, "R": 0, "E": 0}
            for b, s in self.possibilities:
                counts[self.get_result(b, s, l, r)] += 1
            
            worst = max(counts.values())
            if worst < min_worst_case:
                min_worst_case = worst
                best_l, best_r = l, r

        if not best_l: # Fallback
            best_l, best_r = [candidates[0]], [candidates[1]]

        self.current_l, self.current_r = best_l, best_r
        document.getElementById("instruction").innerText = f"Place {len(best_l)} balls on each side"
        
        # Update UI
        for i in range(1, self.n + 1):
            el = document.getElementById(f"b_{i}")
            if i in self.current_l: document.getElementById("p_left").appendChild(el)
            elif i in self.current_r: document.getElementById("p_right").appendChild(el)
            else: document.getElementById("storage").appendChild(el)

    def handle_click(self, feedback):
        # Update scale tilt
        beam = document.getElementById("beam_element")
        if feedback == "left": beam.className = "beam tilt-left"
        elif feedback == "right": beam.className = "beam tilt-right"
        else: beam.className = "beam"

        # Filter possibilities
        map_code = {"left": "L", "right": "R", "equal": "E"}
        target = map_code[feedback]
        self.possibilities = [p for p in self.possibilities if self.get_result(p[0], p[1], self.current_l, self.current_r) == target]
        
        # Small delay to see the tilt before next step
        window.setTimeout(create_proxy(self.calculate_and_render), 700)

    def show_solution(self):
        document.getElementById("action_btns").classList.add("hidden")
        document.getElementById("instruction").innerText = "Analysis complete."
        res_el = document.getElementById("result_display")
        res_el.classList.remove("hidden")
        document.getElementById("reload_btn").classList.remove("hidden")
        
        if len(self.possibilities) == 1:
            ball, state = self.possibilities[0]
            res_el.innerText = f"RESULT: Ball {ball} is {state.upper()}!"
        else:
            res_el.innerText = "Error: Logical contradiction. Please restart."

ai_game = None

def start(event):
    global ai_game
    n = int(document.getElementById("ball_input").value)
    document.getElementById("setup-area").classList.add("hidden")
    document.getElementById("game-area").style.display = "block"
    
    store = document.getElementById("storage")
    for i in range(1, n + 1):
        b = document.createElement("div")
        b.className = "ball"
        b.id = f"b_{i}"
        b.innerText = str(i)
        store.appendChild(b)
    
    ai_game = AIController(n)

document.getElementById("start_trigger").onclick = create_proxy(start)
document.getElementById("v_left").onclick = create_proxy(lambda e: ai_game.handle_click("left"))
document.getElementById("v_equal").onclick = create_proxy(lambda e: ai_game.handle_click("equal"))
document.getElementById("v_right").onclick = create_proxy(lambda e: ai_game.handle_click("right"))
</script>
</body>
</html>
