<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>I will find the wrong ball</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 550px; text-align: center; }
        .instruction-box { background: #eef2ff; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; color: #3730a3; text-align: left; border: 1px solid #c7d2fe; }
        .scale-area { position: relative; height: 160px; margin: 2rem 0; }
        .beam { width: 100%; height: 8px; background: #475569; position: absolute; top: 50%; left: 0; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 4px; transform-origin: center; }
        .pan { width: 120px; min-height: 60px; border: 3px solid #475569; border-top: 0; position: absolute; top: 8px; border-radius: 0 0 55px 55px; background: rgba(0,0,0,0.03); display: flex; flex-wrap: wrap; justify-content: center; padding: 5px; }
        .left { left: 0; } .right { right: 0; }
        .ball { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; font-size: 11px; display: flex; align-items: center; justify-content: center; margin: 2px; font-weight: bold; }
        .btn { padding: 12px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; color: white; transition: opacity 0.2s; }
        .btn-blue { background: #2563eb; } .btn-gray { background: #64748b; } .btn-red { background: #e11d48; } .btn-green { background: #16a34a; width: 100%; font-size: 1.1rem; }
        .tilt-left { transform: rotate(-12deg); } .tilt-right { transform: rotate(12deg); }
        #game-area { display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-area">
        <h2>I will find the wrong ball</h2>
        <div class="instruction-box">
            Basierend auf Hypothesen-Eliminierung: Jede Kugel könnte 'schwerer' oder 'leichter' sein. Die KI wählt die Wägung, die im schlechtesten Fall die meisten Hypothesen ausschließt.
        </div>
        <p>Anzahl Kugeln (Empfehlung: 12):</p>
        <input type="number" id="ball_input" value="12" style="font-size: 1.5rem; width: 80px; text-align: center;"><br><br>
        <button id="start_trigger" class="btn btn-green">KI-Suche starten</button>
    </div>

    <div id="game-area">
        <div id="max_info" style="font-weight: bold; color: #ef4444; margin-bottom: 10px;"></div>
        <div class="scale-area">
            <div id="beam_element" class="beam">
                <div class="pan left" id="p_left"></div>
                <div class="pan right" id="p_right"></div>
            </div>
        </div>
        <h3 id="step_info" style="color: #2563eb; margin:0;"></h3>
        <p id="instruction" style="font-weight: 500; margin-top:5px;"></p>
        <div id="action_btns">
            <button id="v_left" class="btn btn-blue">Links schwerer</button>
            <button id="v_equal" class="btn btn-gray">Gleichgewicht</button>
            <button id="v_right" class="btn btn-red">Rechts schwerer</button>
        </div>
        <div id="result_display" class="hidden" style="margin: 20px 0; padding: 15px; background: #f0fdf4; border: 2px solid #22c55e; border-radius: 10px; color: #166534; font-weight: bold; font-size: 1.1rem;"></div>
        <button id="reload_btn" class="btn btn-gray hidden" onclick="location.reload()">Neustart</button>
        <div id="storage" style="margin-top:20px; border-top: 1px solid #e2e8f0; padding-top:15px; display:flex; flex-wrap:wrap; justify-content:center;"></div>
    </div>
</div>

<script type="py">
from pyscript import document, window
from pyodide.ffi import create_proxy
import itertools

class LogicEngine:
    def __init__(self, n):
        self.n = n
        # Hypothesenraum: (Kugel_ID, Typ) -> 1=Schwerer, -1=Leichter
        self.hypotheses = []
        for i in range(1, n + 1):
            self.hypotheses.append((i, 1))  # Kugel i ist schwerer
            self.hypotheses.append((i, -1)) # Kugel i ist leichter
        self.step = 0
        self.current_l = []
        self.current_r = []
        self.calculate_next_move()

    def simulate_weighing(self, hypothesis, left_group, right_group):
        ball_id, weight_type = hypothesis
        left_weight = 0
        right_weight = 0
        if ball_id in left_group: left_weight = weight_type
        if ball_id in right_group: right_weight = weight_type
        
        if left_weight > right_weight: return "L"
        if right_weight > left_weight: return "R"
        return "E"

    def calculate_next_move(self):
        if len(self.hypotheses) <= 1:
            self.show_solution()
            return

        self.step += 1
        document.getElementById("step_info").innerText = f"Wägung {self.step}"
        
        best_l, best_r = [], []
        min_max_remaining = 999
        
        # Wir prüfen mögliche Wägungs-Größen (m vs m)
        # Um Rechenleistung zu sparen, limitieren wir die Suche bei hohen Kugelzahlen, 
        # aber für 12 Kugeln ist es exakt.
        for m in range(1, (self.n // 2) + 1):
            # Wir generieren eine sinnvolle Test-Wägung
            # Strategie: Wir nehmen eine Mischung aus "Verdächtigen" und "Sicheren"
            suspect_balls = list(set([h[0] for h in self.hypotheses]))
            all_balls = list(range(1, self.n + 1))
            
            # Da wir nicht alle Kombinationen (2^12) prüfen können, 
            # nutzen wir eine Heuristik: Wir verteilen die aktuellen Verdächtigen 
            # gleichmäßig auf links, rechts und weg.
            l = suspect_balls[:m]
            r = suspect_balls[m:2*m]
            
            # Falls Schalen ungleich, mit "sicheren" Kugeln auffüllen
            if len(l) < m or len(r) < m:
                safe_balls = [b for b in all_balls if b not in suspect_balls]
                while len(l) < m and safe_balls: l.append(safe_balls.pop())
                while len(r) < m and safe_balls: r.append(safe_balls.pop())
            
            if len(l) != len(r) or not r: continue

            # Minimax-Berechnung
            outcomes = {"L": 0, "R": 0, "E": 0}
            for h in self.hypotheses:
                res = self.simulate_weighing(h, l, r)
                outcomes[res] += 1
            
            worst_case = max(outcomes.values())
            if worst_case < min_max_remaining:
                min_max_remaining = worst_case
                best_l, best_r = l, r

        self.current_l, self.current_r = best_l, best_r
        document.getElementById("instruction").innerText = f"KI legt {len(best_l)} vs {len(best_r)} Kugeln auf."
        self.update_ui()

    def update_ui(self):
        for i in range(1, self.n + 1):
            el = document.getElementById(f"b_{i}")
            if i in self.current_l: document.getElementById("p_left").appendChild(el)
            elif i in self.current_r: document.getElementById("p_right").appendChild(el)
            else: document.getElementById("storage").appendChild(el)

    def process_result(self, feedback):
        beam = document.getElementById("beam_element")
        beam.className = f"beam tilt-{feedback}" if feedback != "equal" else "beam"
        
        target = {"left": "L", "right": "R", "equal": "E"}[feedback]
        # Filter Hypothesen: Behalte nur die, die mit dem Ergebnis kompatibel sind
        self.hypotheses = [h for h in self.hypotheses if self.simulate_weighing(h, self.current_l, self.current_r) == target]
        
        window.setTimeout(create_proxy(self.calculate_next_move), 600)

    def show_solution(self):
        document.getElementById("action_btns").classList.add("hidden")
        res_el = document.getElementById("result_display")
        res_el.classList.remove("hidden")
        document.getElementById("reload_btn").classList.remove("hidden")
        if len(self.hypotheses) == 1:
            id, weight = self.hypotheses[0]
            w_str = "SCHWERER" if weight == 1 else "LEICHTER"
            res_el.innerText = f"GEFUNDEN: Kugel {id} ist {w_str}!"
        else:
            res_el.innerText = "Widerspruch in der Eingabe! Bitte neu starten."

engine = None

def start(e):
    global engine
    n = int(document.getElementById("ball_input").value)
    document.getElementById("setup-area").classList.add("hidden")
    document.getElementById("game-area").style.display = "block"
    store = document.getElementById("storage")
    for i in range(1, n + 1):
        b = document.createElement("div")
        b.className = "ball"
        b.id = f"b_{i}"
        b.innerText = str(i)
        store.appendChild(b)
    engine = LogicEngine(n)

document.getElementById("start_trigger").onclick = create_proxy(start)
document.getElementById("v_left").onclick = create_proxy(lambda e: engine.process_result("left"))
document.getElementById("v_equal").onclick = create_proxy(lambda e: engine.process_result("equal"))
document.getElementById("v_right").onclick = create_proxy(lambda e: engine.process_result("right"))
</script>
</body>
</html>
