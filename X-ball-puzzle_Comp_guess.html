<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Universelles Kugel-Rätsel: Hypothesen-Logik</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 700px; text-align: center; }
        .instruction-box { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; color: #475569; text-align: left; border: 1px solid #e2e8f0; }
        .scale-area { position: relative; height: 160px; margin: 1.5rem 0; border-bottom: 2px solid #f1f5f9; }
        .beam { width: 100%; height: 8px; background: #334155; position: absolute; top: 50%; left: 0; transition: transform 0.6s ease-in-out; border-radius: 4px; transform-origin: center; }
        .pan { width: 140px; min-height: 60px; border: 3px solid #334155; border-top: 0; position: absolute; top: 8px; border-radius: 0 0 70px 70px; background: rgba(0,0,0,0.02); display: flex; flex-wrap: wrap; justify-content: center; padding: 5px; }
        .left { left: 0; } .right { right: 0; }
        .ball { width: 24px; height: 24px; border-radius: 50%; background: #2563eb; color: white; font-size: 10px; display: flex; align-items: center; justify-content: center; margin: 2px; font-weight: bold; }
        .btn { padding: 10px 15px; margin: 5px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; color: white; }
        .btn-blue { background: #3b82f6; } .btn-gray { background: #94a3b8; } .btn-red { background: #ef4444; } .btn-green { background: #10b981; width: 100%; }
        .tilt-left { transform: rotate(-10deg); } .tilt-right { transform: rotate(10deg); }
        #game-area { display: none; }
        .storage-bin { margin-top:20px; border: 2px dashed #e2e8f0; border-radius: 10px; padding: 10px; display:flex; flex-wrap:wrap; justify-content:center; background: #fcfcfc; }
        #status-log { font-family: monospace; font-size: 0.75rem; color: #64748b; margin-top: 15px; text-align: left; background: #f8fafc; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-area">
        <h2>X-Kugel Hypothesen-Eliminierung</h2>
        <div class="instruction-box">
            Geben Sie die Anzahl der Kugeln an. Die KI berechnet für jeden Schritt die optimale Wägung, indem sie alle 2*N Hypothesen ("Kugel X ist schwerer/leichter") simuliert.
        </div>
        <p>Anzahl der Kugeln:</p>
        <input type="number" id="ball_count" value="12" style="font-size: 1.2rem; width: 80px; text-align: center; border: 1px solid #cbd5e1; border-radius: 5px; padding: 5px;"><br><br>
        <button id="start_btn" class="btn btn-green">KI-Berechnung starten</button>
    </div>

    <div id="game-area">
        <div class="scale-area">
            <div id="beam_element" class="beam">
                <div class="pan left" id="p_left"></div>
                <div class="pan right" id="p_right"></div>
            </div>
        </div>
        <h3 id="step_info"></h3>
        <p id="instruction"></p>
        <div id="action_btns">
            <button id="v_left" class="btn btn-blue">Links schwerer</button>
            <button id="v_equal" class="btn btn-gray">Gleich</button>
            <button id="v_right" class="btn btn-red">Rechts schwerer</button>
        </div>
        <div id="result_display" class="hidden" style="margin-top:20px; padding:15px; background:#ecfdf5; border:2px solid #10b981; color:#065f46; font-weight:bold; border-radius:8px;"></div>
        <button id="reload_btn" class="btn btn-gray hidden" style="margin-top:10px" onclick="location.reload()">Neustart</button>
        <div id="status-log"></div>
        <div id="storage" class="storage-bin"></div>
    </div>
</div>

<script type="py">
from pyscript import document, window
from pyodide.ffi import create_proxy
import math

class UniversalLogicAI:
    def __init__(self, n):
        self.n = n
        # Jede Kugel kann schwerer (+1) oder leichter (-1) sein
        self.hypotheses = [(i, w) for i in range(1, n + 1) for w in [1, -1]]
        self.step = 0
        self.current_l = []
        self.current_r = []
        self.log_msg(f"Initialisiert mit {len(self.hypotheses)} Hypothesen.")
        self.calculate_next()

    def log_msg(self, text):
        log_el = document.getElementById("status-log")
        log_el.innerText += text + "\n"

    def get_outcome(self, hyp, left, right):
        ball, weight = hyp
        l_sum = weight if ball in left else 0
        r_sum = weight if ball in right else 0
        if l_sum > r_sum: return "L"
        if r_sum > l_sum: return "R"
        return "E"

    def calculate_next(self):
        if len(self.hypotheses) <= 1:
            self.finish()
            return

        self.step += 1
        document.getElementById("step_info").innerText = f"Wägung {self.step}"
        
        suspects = list(set([h[0] for h in self.hypotheses]))
        all_balls = list(range(1, self.n + 1))
        safe = [b for b in all_balls if b not in suspects]
        
        best_l, best_r = [], []
        min_worst_case = len(self.hypotheses) + 1
        
        # Minimax Suche: Wir optimieren die Kugel-Verteilung
        # Wir testen m vs m Kugeln
        max_m = self.n // 2
        for m in range(1, max_m + 1):
            # Heuristik: Wir verteilen Verdächtige auf L, R und Neutral
            # Um Rechenzeit zu sparen bei großen N, testen wir strategische Verteilungen
            for n_l in range(min(m, len(suspects)) + 1):
                n_r_max = min(m, len(suspects) - n_l)
                for n_r in range(n_r_max + 1):
                    l_susp = suspects[:n_l]
                    r_susp = suspects[n_l : n_l + n_r]
                    
                    # Auffüllen mit sicheren Kugeln (Referenz-Theorie)
                    needed_l, needed_r = m - len(l_susp), m - len(r_susp)
                    if needed_l + needed_r <= len(safe):
                        l_final = l_susp + safe[:needed_l]
                        r_final = r_susp + safe[needed_l : needed_l + needed_r]
                        
                        outcomes = {"L": 0, "R": 0, "E": 0}
                        for h in self.hypotheses:
                            outcomes[self.get_outcome(h, l_final, r_final)] += 1
                        
                        worst = max(outcomes.values())
                        if worst < min_worst_case:
                            min_worst_case = worst
                            best_l, best_r = l_final, r_final
                            if worst <= math.ceil(len(self.hypotheses) / 3): break

        self.current_l, self.current_r = best_l, best_r
        document.getElementById("instruction").innerText = f"KI vergleicht {len(best_l)} gegen {len(best_r)} Kugeln."
        self.log_msg(f"Wägung {self.step}: Bester Worst-Case = {min_worst_case} Hypothesen.")
        self.draw()

    def draw(self):
        for i in range(1, self.n + 1):
            el = document.getElementById(f"b_{i}")
            if i in self.current_l: document.getElementById("p_left").appendChild(el)
            elif i in self.current_r: document.getElementById("p_right").appendChild(el)
            else: document.getElementById("storage").appendChild(el)
        document.getElementById("beam_element").className = "beam"

    def apply_feedback(self, res):
        target = {"left": "L", "right": "R", "equal": "E"}[res]
        beam = document.getElementById("beam_element")
        beam.className = f"beam tilt-{res}" if res != "equal" else "beam"
        
        self.hypotheses = [h for h in self.hypotheses if self.get_outcome(h, self.current_l, self.current_r) == target]
        self.log_msg(f"Feedback erhalten: {target}. Verbleibende Hypothesen: {len(self.hypotheses)}")
        
        window.setTimeout(create_proxy(self.calculate_next), 600)

    def finish(self):
        document.getElementById("action_btns").style.display = "none"
        res_el = document.getElementById("result_display")
        res_el.classList.remove("hidden")
        document.getElementById("reload_btn").classList.remove("hidden")
        if len(self.hypotheses) == 1:
            b, w = self.hypotheses[0]
            res_el.innerText = f"ERGEBNIS: Kugel {b} ist {'SCHWERER' if w==1 else 'LEICHTER'}!"
        else:
            res_el.innerText = "Widerspruch: Keine Hypothese passt zu Ihren Angaben."

active_logic = None

def start_logic(e):
    global active_logic
    n = int(document.getElementById("ball_count").value)
    document.getElementById("setup-area").style.display = "none"
    document.getElementById("game-area").style.display = "block"
    store = document.getElementById("storage")
    for i in range(1, n + 1):
        b = document.createElement("div")
        b.className = "ball"; b.id = f"b_{i}"; b.innerText = str(i)
        store.appendChild(b)
    active_logic = UniversalLogicAI(n)

document.getElementById("start_btn").onclick = create_proxy(start_logic)
document.getElementById("v_left").onclick = create_proxy(lambda e: active_logic.apply_feedback("left"))
document.getElementById("v_equal").onclick = create_proxy(lambda e: active_logic.apply_feedback("equal"))
document.getElementById("v_right").onclick = create_proxy(lambda e: active_logic.apply_feedback("right"))
</script>
</body>
</html>
