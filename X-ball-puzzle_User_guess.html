<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Challenge - Animated Logic Engine</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 20px; color: #1e293b; }
        .container { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 900px; }
        
        .nav-header { display: flex; justify-content: flex-start; margin-bottom: 20px; }
        .header-stats { display: flex; justify-content: space-around; background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .stat-card { text-align: center; }
        .stat-value { display: block; font-size: 1.5rem; font-weight: bold; color: #2563eb; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; }

        .game-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        
        /* Scale Section & Animations */
        .scale-section { text-align: center; background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .scale-area { position: relative; height: 160px; margin: 40px 0; border-bottom: 3px solid #e2e8f0; }
        .beam { 
            width: 100%; height: 10px; background: #334155; position: absolute; top: 50%; left: 0; 
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); 
            border-radius: 5px; transform-origin: center; 
        }
        .pan { 
            width: 130px; min-height: 60px; border: 4px solid #334155; border-top: 0; 
            position: absolute; top: 10px; border-radius: 0 0 65px 65px; 
            background: rgba(0,0,0,0.03); display: flex; flex-wrap: wrap; 
            justify-content: center; padding: 5px; transition: transform 0.7s;
        }
        .left { left: 0; } .right { right: 0; }
        
        /* Ball Styling */
        .ball { 
            width: 32px; height: 32px; border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1d4ed8); 
            color: white; font-size: 12px; display: flex; align-items: center; 
            justify-content: center; margin: 3px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.15); 
            transition: transform 0.2s, opacity 0.3s; 
        }
        .ball:hover { transform: scale(1.15); background: #2563eb; }
        
        .tilt-left { transform: rotate(-10deg); }
        .tilt-right { transform: rotate(10deg); }
        
        /* Side Panel */
        .side-panel { display: flex; flex-direction: column; gap: 15px; }
        .info-box { background: #eff6ff; padding: 15px; border-radius: 10px; border: 1px solid #bfdbfe; font-size: 0.9rem; }
        .log-box { background: #1e293b; color: #38bdf8; font-family: 'Consolas', monospace; padding: 12px; border-radius: 8px; height: 250px; overflow-y: auto; font-size: 0.8rem; text-align: left; }
        
        .storage-area { 
            margin-top: 20px; padding: 15px; background: #f8fafc; border: 2px dashed #cbd5e1; 
            border-radius: 10px; display: flex; flex-wrap: wrap; min-height: 80px; 
            justify-content: center; align-content: flex-start; gap: 5px;
        }
        
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; text-decoration: none; transition: 0.2s; }
        .btn-gray { background: #64748b; } .btn-green { background: #10b981; } .btn-blue { background: #3b82f6; width: 100%; font-size: 1.1rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="index.html" class="btn btn-gray">← Back to Hub</a>
    </div>

    <div id="setup-area" style="text-align: center;">
        <h2>User Challenge: Find the Imposter</h2>
        <p>One ball has a different weight. Can you find it?</p>
        <div style="margin: 20px 0;">
            <input type="number" id="ball_count" value="12" min="3" max="30" style="padding:10px; width:80px; text-align:center; font-size:1.2rem;">
        </div>
        <button id="start_btn" class="btn btn-green">Start Challenge</button>
    </div>

    <div id="game-area" class="hidden">
        <div class="header-stats">
            <div class="stat-card"><span class="stat-label">Step</span><span id="stat_step" class="stat-value">0</span></div>
            <div class="stat-card"><span class="stat-label">Target Max</span><span id="stat_max" class="stat-value">3</span></div>
            <div class="stat-card"><span class="stat-label">Hypotheses</span><span id="stat_hyp" class="stat-value">24</span></div>
        </div>

        <div class="game-layout">
            <div class="scale-section">
                <div class="scale-area">
                    <div id="beam_element" class="beam">
                        <div class="pan left" id="pan_l"></div>
                        <div class="pan right" id="pan_r"></div>
                    </div>
                </div>
                <button id="weigh_btn" class="btn btn-blue">Weigh Balls</button>
                <div id="storage" class="storage-area"></div>
            </div>

            <div class="side-panel">
                <div class="info-box">
                    <strong style="color: #2563eb;">AI Recommendation:</strong><br>
                    <span id="ai_tip">Initializing...</span>
                </div>
                <div class="log-box" id="status_log"></div>
                <button id="solve_btn" class="btn btn-green" style="width:100%">I know the answer!</button>
            </div>
        </div>
    </div>
</div>

<script type="py">
import random
import math
from pyscript import document, window
from pyodide.ffi import create_proxy

class InteractiveGame:
    def __init__(self, n):
        self.n = n
        self.step = 0
        self.max_steps = math.ceil(math.log(2 * n, 3))
        self.hypotheses = [(i, w) for i in range(1, n + 1) for w in [1, -1]]
        self.secret = random.choice(self.hypotheses)
        
        self.init_balls()
        self.update_ui()
        self.log(f"Challenge started for {n} balls.")

    def init_balls(self):
        storage = document.getElementById("storage")
        storage.innerHTML = ""
        for i in range(1, self.n + 1):
            ball = document.createElement("div")
            ball.className = "ball"
            ball.id = f"ball_{i}"
            ball.innerText = str(i)
            ball.onclick = create_proxy(lambda e, id=i: self.cycle_ball(id))
            storage.appendChild(ball)
        self.sort_storage()

    def cycle_ball(self, ball_id):
        ball = document.getElementById(f"ball_{ball_id}")
        # Reset tilt when any ball is moved
        document.getElementById("beam_element").className = "beam"
        
        if ball.parentElement.id == "storage":
            document.getElementById("pan_l").appendChild(ball)
        elif ball.parentElement.id == "pan_l":
            document.getElementById("pan_r").appendChild(ball)
        else:
            document.getElementById("storage").appendChild(ball)
            self.sort_storage()

    def sort_storage(self):
        storage = document.getElementById("storage")
        balls = list(storage.children)
        # Sort by ID (numeric value of innerText)
        balls.sort(key=lambda x: int(x.innerText))
        for b in balls:
            storage.appendChild(b)

    def log(self, msg):
        log_el = document.getElementById("status_log")
        log_el.innerHTML += f"<div>> {msg}</div>"
        log_el.scrollTop = log_el.scrollHeight

    def update_ui(self):
        document.getElementById("stat_step").innerText = str(self.step)
        document.getElementById("stat_max").innerText = str(self.max_steps)
        document.getElementById("stat_hyp").innerText = str(len(self.hypotheses))
        
        tip_el = document.getElementById("ai_tip")
        suspects = list(set([h[0] for h in self.hypotheses]))
        if len(self.hypotheses) == 1:
            tip_el.innerText = "Solution identified! Use 'I know the answer'."
        else:
            tip_el.innerText = f"Focus on balls: {sorted(suspects)}"

    def weigh(self, e):
        l_ids = [int(b.innerText) for b in document.getElementById("pan_l").children]
        r_ids = [int(b.innerText) for b in document.getElementById("pan_r").children]
        
        if len(l_ids) != len(r_ids) or len(l_ids) == 0:
            window.alert("Pans must be equal and not empty!")
            return

        self.step += 1
        
        # Real Physics Calculation
        target_id, target_w = self.secret
        l_mass = target_w if target_id in l_ids else 0
        r_mass = target_w if target_id in r_ids else 0
        
        res = "equal"
        if l_mass > r_mass: res = "left"
        elif r_mass > l_mass: res = "right"
        
        # Animate Scale
        document.getElementById("beam_element").className = f"beam tilt-{res}"
        
        # Filter Logic
        code = {"left":"L", "right":"R", "equal":"E"}[res]
        before = len(self.hypotheses)
        self.hypotheses = [h for h in self.hypotheses if self.check_outcome(h, l_ids, r_ids) == code]
        
        self.log(f"Step {self.step}: Result {res.upper()}. ({before - len(self.hypotheses)} hypotheses eliminated)")
        self.update_ui()

    def check_outcome(self, hyp, left, right):
        b, w = hyp
        l = w if b in left else 0
        r = w if b in right else 0
        return "L" if l > r else "R" if r > l else "E"

    def solve(self, e):
        ans = window.prompt("Which Ball ID?")
        if not ans: return
        w = window.prompt("Is it (H)eavy or (L)ight?").upper()
        
        if (int(ans), 1 if w == "H" else -1) == self.secret:
            window.alert("CORRECT!")
            window.location.reload()
        else:
            window.alert(f"WRONG. It was Ball {self.secret[0]} ({'Heavy' if self.secret[1]==1 else 'Light'}).")

game = None
def start(e):
    global game
    n = int(document.getElementById("ball_count").value)
    document.getElementById("setup-area").classList.add("hidden")
    document.getElementById("game-area").classList.remove("hidden")
    game = InteractiveGame(n)

document.getElementById("start_btn").onclick = create_proxy(start)
document.getElementById("weigh_btn").onclick = create_proxy(lambda e: game.weigh(e))
document.getElementById("solve_btn").onclick = create_proxy(lambda e: game.solve(e))
</script>
</body>
</html>
