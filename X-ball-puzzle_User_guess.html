<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Challenge - Logic Puzzle Engine</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 20px; color: #1e293b; }
        .container { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 900px; }
        
        .header-stats { display: flex; justify-content: space-around; background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .stat-card { text-align: center; }
        .stat-value { display: block; font-size: 1.5rem; font-weight: bold; color: #2563eb; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; }

        .game-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        
        .scale-section { text-align: center; background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .scale-area { position: relative; height: 140px; margin: 40px 0; border-bottom: 2px solid #e2e8f0; }
        .beam { width: 100%; height: 8px; background: #334155; position: absolute; top: 50%; left: 0; transition: transform 0.6s; border-radius: 4px; transform-origin: center; }
        .pan { width: 120px; min-height: 50px; border: 3px solid #334155; border-top: 0; position: absolute; top: 8px; border-radius: 0 0 60px 60px; background: rgba(0,0,0,0.03); display: flex; flex-wrap: wrap; justify-content: center; padding: 5px; cursor: pointer; }
        .left { left: 0; } .right { right: 0; }
        
        .ball { width: 30px; height: 30px; border-radius: 50%; background: #3b82f6; color: white; font-size: 12px; display: flex; align-items: center; justify-content: center; margin: 3px; font-weight: bold; cursor: grab; transition: transform 0.2s; }
        .ball:hover { transform: scale(1.1); background: #2563eb; }
        
        .side-panel { display: flex; flex-direction: column; gap: 15px; }
        .info-box { background: #eff6ff; padding: 15px; border-radius: 10px; border: 1px solid #bfdbfe; font-size: 0.9rem; }
        .log-box { background: #1e293b; color: #38bdf8; font-family: monospace; padding: 10px; border-radius: 8px; height: 200px; overflow-y: auto; font-size: 0.8rem; }
        
        .storage-area { margin-top: 20px; padding: 15px; background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 10px; display: flex; flex-wrap: wrap; min-height: 60px; justify-content: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; margin: 5px; }
        .btn-green { background: #10b981; } .btn-blue { background: #3b82f6; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-area" style="text-align: center;">
        <h2>User Challenge: Find the Ball</h2>
        <p>The AI will hide a "fake" ball. Can you find it within the maximum steps?</p>
        <input type="number" id="ball_count" value="12" class="ball-input" style="padding:10px; width:60px; text-align:center;">
        <button id="start_btn" class="btn btn-green">Start Challenge</button>
    </div>

    <div id="game-area" class="hidden">
        <div class="header-stats">
            <div class="stat-card"><span class="stat-label">Steps Used</span><span id="stat_step" class="stat-value">0</span></div>
            <div class="stat-card"><span class="stat-label">Target Max</span><span id="stat_max" class="stat-value">3</span></div>
            <div class="stat-card"><span class="stat-label">Possibilities</span><span id="stat_hyp" class="stat-value">24</span></div>
        </div>

        <div class="game-layout">
            <div class="scale-section">
                <p>Drag balls to the pans or click to move them back.</p>
                <div class="scale-area">
                    <div id="beam_element" class="beam">
                        <div class="pan left" id="pan_l"></div>
                        <div class="pan right" id="pan_r"></div>
                    </div>
                </div>
                <button id="weigh_btn" class="btn btn-blue" style="width: 200px; font-size: 1.2rem;">Weigh Balls!</button>
                <div id="storage" class="storage-area"></div>
            </div>

            <div class="side-panel">
                <div class="info-box">
                    <strong>AI Recommendation:</strong><br>
                    <span id="ai_tip">Calculating best move...</span>
                </div>
                <div class="log-box" id="status_log"></div>
                <button id="solve_btn" class="btn btn-green">I know the answer!</button>
            </div>
        </div>
    </div>
</div>

<script type="py">
import random
import math
from pyscript import document, window
from pyodide.ffi import create_proxy

class UserPuzzleGame:
    def __init__(self, n):
        self.n = n
        self.step = 0
        self.max_steps = math.ceil(math.log(2 * n, 3))
        
        # All possible truths (Hypotheses)
        self.all_hypotheses = [(i, w) for i in range(1, n + 1) for w in [1, -1]]
        self.remaining_hypotheses = list(self.all_hypotheses)
        
        # AI secret target
        self.secret_truth = random.choice(self.all_hypotheses)
        
        self.setup_balls()
        self.update_stats()
        self.generate_tip()
        self.log("Game started! Find the hidden property.")

    def setup_balls(self):
        storage = document.getElementById("storage")
        for i in range(1, self.n + 1):
            b = document.createElement("div")
            b.className = "ball"
            b.id = f"ball_{i}"
            b.innerText = str(i)
            b.onclick = create_proxy(lambda e, id=i: self.move_ball(id))
            storage.appendChild(b)

    def move_ball(self, ball_id):
        ball_el = document.getElementById(f"ball_{ball_id}")
        if ball_el.parentElement.id == "storage":
            # Default move to left pan if free
            document.getElementById("pan_l").appendChild(ball_el)
        elif ball_el.parentElement.id in ["pan_l", "pan_r"]:
            if ball_el.parentElement.id == "pan_l":
                document.getElementById("pan_r").appendChild(ball_el)
            else:
                document.getElementById("storage").appendChild(ball_el)

    def update_stats(self):
        document.getElementById("stat_step").innerText = str(self.step)
        document.getElementById("stat_max").innerText = str(self.max_steps)
        document.getElementById("stat_hyp").innerText = str(len(self.remaining_hypotheses))

    def log(self, msg):
        log_el = document.getElementById("status_log")
        log_el.innerHTML += f"<div>> {msg}</div>"
        log_el.scrollTop = log_el.scrollHeight

    def weigh(self, e):
        left_ids = [int(b.innerText) for b in document.getElementById("pan_l").children]
        right_ids = [int(b.innerText) for b in document.getElementById("pan_r").children]
        
        if len(left_ids) != len(right_ids) or len(left_ids) == 0:
            window.alert("Pans must contain an equal number of balls!")
            return

        self.step += 1
        
        # Determine actual outcome based on secret
        target_ball, target_weight = self.secret_truth
        l_mass = target_weight if target_ball in left_ids else 0
        r_mass = target_weight if target_ball in right_ids else 0
        
        res = "equal"
        if l_mass > r_mass: res = "left"
        elif r_mass > l_mass: res = "right"
        
        # Filter hypotheses
        res_code = {"left": "L", "right": "R", "equal": "E"}[res]
        self.remaining_hypotheses = [h for h in self.remaining_hypotheses if self.get_sim_outcome(h, left_ids, right_ids) == res_code]
        
        # Visual tilt
        beam = document.getElementById("beam_element")
        beam.className = f"beam tilt-{res}" if res != "equal" else "beam"
        
        self.log(f"Weighing {self.step}: {res.upper()}")
        self.update_stats()
        self.generate_tip()

    def get_sim_outcome(self, hyp, left, right):
        b, w = hyp
        l = w if b in left else 0
        r = w if b in right else 0
        return "L" if l > r else "R" if r > l else "E"

    def generate_tip(self):
        tip_el = document.getElementById("ai_tip")
        if len(self.remaining_hypotheses) <= 1:
            tip_el.innerText = "You have enough info to solve it!"
            return

        # Minimax logic for the best suggestion
        best_move = "Try splitting the suspects evenly."
        suspects = list(set([h[0] for h in self.remaining_hypotheses]))
        safe = [i for i in range(1, self.n+1) if i not in suspects]
        
        # Suggest 4vs4 for 12 balls at step 1
        if self.step == 0 and self.n == 12:
            best_move = "Weigh balls [1,2,3,4] vs [5,6,7,8]."
        else:
            # Simple heuristic for the tip
            m = len(suspects) // 3
            if m == 0: m = 1
            best_move = f"Try weighing {m} suspect(s) against {m} safe or other suspect balls."
            
        tip_el.innerText = best_move

    def handle_solve(self, e):
        guess = window.prompt("Which ball is it? (ID)")
        weight = window.prompt("Is it (H)eavy or (L)ight?").upper()
        
        w_val = 1 if weight == "H" else -1
        if (int(guess), w_val) == self.secret_truth:
            window.alert(f"CORRECT! You found it in {self.step} steps.")
            window.location.reload()
        else:
            window.alert(f"WRONG! The secret was Ball {self.secret_truth[0]} ({'Heavy' if self.secret_truth[1]==1 else 'Light'}).")

game = None
def start_game(e):
    global game
    n = int(document.getElementById("ball_count").value)
    document.getElementById("setup-area").classList.add("hidden")
    document.getElementById("game-area").classList.remove("hidden")
    game = UserPuzzleGame(n)

document.getElementById("start_btn").onclick = create_proxy(start_game)
document.getElementById("weigh_btn").onclick = create_proxy(lambda e: game.weigh(e))
document.getElementById("solve_btn").onclick = create_proxy(lambda e: game.handle_solve(e))
</script>
</body>
</html>
